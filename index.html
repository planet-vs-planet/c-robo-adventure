<html lang="ja">

:root[data-theme="dark"]{--card:#16293b;--ink:#e8f4ff;--mute:#9bb5c9;--line:#2b4560;--acc:#ff8a3a;--accink:#1a0c00;--code:#0a1520;--ok:#4cc47f;--ng:#f27a72}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(var(--b1),var(--b2)) fixed;color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;font-weight:500;line-height:1.6}

.t.b{background:var(--t2)}

.t .c.got{opacity:0;transform:translateY(-14px) scale(1.7)}

.ring{width:84%;height:84%;transition:transform .34s;filter:drop-shadow(0 4px 2px rgba(0,0,0,.4))}
.ring svg{width:100%;height:100%;display:block}
.hop .ring{animation:hp .34s}
@keyframes hp{50%{translate:0 -5px;scale:1.08}}
.shake{animation:sh .4s}
@keyframes sh{25%{translate:-7px 0}75%{translate:7px 0}}
.code{background:var(--code);color:var(--codeink);border-radius:14px;padding:10px 6px;min-height:120px;font-size:14px;line-height:1.75;margin-bottom:6px;max-height:300px;overflow:auto}
.ln{display:flex;border-radius:6px;padding:0 8px}.ln.on{background:var(--hl);color:#13293d}
.no{width:26px;opacity:.55;flex:none}.empty{opacity:.6;padding:6px 8px}
.meta{font-size:13px;color:var(--hd);margin-bottom:8px;display:flex;justify-content:space-between}
.pal{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.cmd{font-weight:700;font-size:14px;padding:10px 12px;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.cmd:hover:not(:disabled){border-color:var(--acc)}
select{font:inherit;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:0 6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:900;font-size:16px;min-height:48px;padding:0 18px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--accink);flex:1}
:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#msg{margin-top:12px;border-radius:14px;padding:12px 14px;background:var(--card);border:2px solid var(--line)}
#msg.ok{border-color:var(--ok)}#msg.ng{border-color:var(--ng)}
.cf{position:fixed;top:-30px;font-size:26px;pointer-events:none;animation:fa 2.4s linear forwards;z-index:9}
@keyframes fa{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    L.coins.forEach(function(c,i){if(c[0]==x&&c[1]==y){var s=document.createElement("span");s.className="c";s.id="c"+i;s.textContent=T.o;t.appendChild(s)}});bd.appendChild(t)}
  var r=document.createElement("div");r.className="rob";r.id="rob";r.innerHTML='<div class="ring" id="ring">'+R+'</div>';bd.appendChild(r);
  place({x:L.s[0],y:L.s[1],a:(L.s[2]==null?1:L.s[2])*90,got:[]});
  var pal=$("pal");
  T.c.forEach(function(k){var b=document.createElement("button");b.className="cmd";b.dataset.k=k;b.textContent=k=="for"?"for (…) {":C[k];pal.appendChild(b);
    if(k=="for"){var s=document.createElement("select");s.id="n";s.setAttribute("aria-label","くりかえす回数");for(var i=1;i<=50;i++){var o=document.createElement("option");o.value=i;o.textContent=i+"回";if(i==2)o.selected=true;s.appendChild(o)}pal.appendChild(s)}});
  pal.onclick=function(e){var k=e.target.dataset&&e.target.dataset.k;if(!k||G.busy||G.prog.length>=L.max)return;G.prog.push({k:k,n:k=="for"?+$("n").value:0});sfx("t");draw()};
  $("undo").onclick=function(){if(!G.busy){G.prog.pop();draw()}};
  $("clr").onclick=function(){if(!G.busy){G.prog=[];draw()}};
  $("run").onclick=go;$("bk").onclick=home;
  $("sn").onclick=function(){G.snd=!G.snd;this.textContent=G.snd?"🔊":"🔇"};
  draw();
}
function draw(hl){
  var L=LV[G.lv],box=$("code");box.innerHTML="";var d=0;
  if(!G.prog.length){var e=document.createElement("div");e.className="empty";e.textContent="// 下のボタンで命令をならべよう";box.appendChild(e)}
  G.prog.forEach(function(l,i){
    if(l.k=="end")d=Math.max(0,d-1);
    var row=document.createElement("div");row.className="ln"+(i===hl?" on":"");
    var n=document.createElement("span");n.className="no";n.textContent=i+1;
    var t=document.createElement("span");t.style.paddingLeft=(d*18)+"px";
    t.textContent=l.k=="for"?"for (int i = 0; i < "+l.n+"; i++) {":C[l.k];
    row.appendChild(n);row.appendChild(t);box.appendChild(row);if(l.k=="for"||l.k=="if")d++});
  $("cnt").textContent=G.prog.length+" / "+L.max+" 行";
  document.querySelectorAll(".cmd").forEach(function(b){b.disabled=G.busy||G.prog.length>=L.max});
  ["run","undo","clr"].forEach(function(k){$(k).disabled=G.busy});
}
function place(s){
  var r=$("rob");r.style.left=(s.x*100/7)+"%";r.style.top=(s.y*100/6)+"%";$("ring").style.transform="rotate("+s.a+"deg)";
  LV[G.lv].coins.forEach(function(c,i){$("c"+i).classList.toggle("got",s.got.indexOf(i)>=0)})}
function say(cls,html){var m=$("msg");m.hidden=false;m.className=cls;m.innerHTML=html}
function go(){
  var L=LV[G.lv];$("msg").hidden=true;
  var p=parse(G.prog);if(p.err){say("ng","<b>おっと!</b><br>"+p.err);sfx("b");return}
  var r=sim(p.root,L);G.busy=true;draw();
  place({x:L.s[0],y:L.s[1],a:(L.s[2]==null?1:L.s[2])*90,got:[]});
  var i=0,prev=0,sp=r.steps.length>40?110:r.steps.length>20?200:380;
  function tick(){
    if(i>=r.steps.length){tm=setTimeout(function(){finish(r)},350);return}
    var st=r.steps[i++];place(st);draw(st.i);
    var ro=$("rob");ro.classList.remove("hop","shake");void ro.offsetWidth;
    if(st.bump){ro.classList.add("shake");sfx("b")}else{ro.classList.add("hop");sfx(st.got.length>prev?"c":"m")}
    prev=st.got.length;tm=setTimeout(tick,sp)}
  tm=setTimeout(tick,250)}
function finish(r){
  var L=LV[G.lv],s=r.s;G.busy=false;draw();
  var atGoal=s.x==L.goal[0]&&s.y==L.goal[1],left=L.coins.length-s.got.length;
  if(r.bump){say("ng","<b>ゴツン!</b><br>壁やフィールドの外には進めないよ。コードを見直そう。");return}
  if(!atGoal||!r.steps.length){say("ng","<b>あと少し!</b><br>ゴール("+W[L.w].g+")に着いていないよ。"+(left?"コインも"+left+"個のこってる。":""));return}
  if(left){say("ng","<b>コインがのこってる!</b><br>あと"+left+"個。全部ひろってからゴールしよう。");return}
  var n=G.prog.length,st=n<=L.par?3:n<=L.par+2?2:1,last=G.lv==LV.length-1;
  G.st[G.lv]=Math.max(G.st[G.lv]||0,st);if(!last)G.un[G.lv+1]=1;
  sfx("w");confetti();
  say("ok","<b>クリア! "+"★".repeat(st)+"☆".repeat(3-st)+"</b><br>"+n+"行でゴール。"+(st<3?"もっと短く書けるかも?":"きれいなコードだね!")+'<div class="row" style="margin-top:10px"><button class="btn p" id="nx">'+(last?"エンディングへ":"つぎのステージへ")+'</button></div>');
  $("nx").onclick=function(){if(last)ending();else{G.lv++;play()}}}
function ending(){
  theme(4);var t=G.st.reduce(function(a,b){return a+(b||0)},0);
  app.innerHTML='<div class="hero">'+R+'<h1>全ステージクリア!</h1><p>★ '+t+' / 75</p></div><div class="wc"><h2>きみが身につけたC言語</h2><p>関数の呼び出し <code>move();</code><br>くりかえし <code>for</code> とそのネスト<br>判断 <code>if</code><br>まとまり <code>{ }</code></p><p>次は「変数」や「ポインタ」に挑戦しよう!</p></div><div class="row"><button class="btn p" id="hm">ステージ選択へ</button></div>';
  $("hm").onclick=home}
home();
</script>
</body>
</html>
